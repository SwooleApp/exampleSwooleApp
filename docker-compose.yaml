
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swoole-app
    ports:
      - '82:9501'
    environment:
      - COMPOSER_HOME=/tmp/composer
      - APP_ENV=production
    depends_on:
      - redis
    networks:
      - swoole-network
  redis:
    image: redis:7-alpine
    container_name: swoole-redis
    ports:
      - '6379:6379'
    networks:
      - swoole-network
networks:
  swoole-network:
    driver: bridge